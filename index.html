<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧢 SMURFS RPG - D&D 5.5</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA / Ícones -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <meta name="theme-color" content="#3b7dbd">
</head>
<body>
    <!-- Header -->
    <div id="header-container">
        <header class="header">
            <div class="header-content">
                <h1>🧢 SMURFS RPG 🧢</h1>
                <button class="header-menu" onclick="toggleMenu()">☰</button>
            </div>
        </header>
    </div>

    <!-- Conteúdo principal -->
    <main class="container" id="main-container">
        <div id="content" class="content-area">
            <!-- Loading Screen -->
            <div class="loading-screen">
                <h1 class="loading-title">SMURFS RPG</h1>
                <div class="loading-spinner"></div>
                <p class="loading-text">Carregando a Vila dos Smurfs...</p>
                
                <!-- Menu de navegação rápido -->
                <div class="loading-menu">
                    <div class="loading-menu-item">
                        <span class="menu-emoji">👾</span>
                        <span>Vilões</span>
                    </div>
                    <div class="loading-menu-item">
                        <span class="menu-emoji">🗺️</span>
                        <span>Mapa</span>
                    </div>
                    <div class="loading-menu-item">
                        <span class="menu-emoji">👥</span>
                        <span>NPCs</span>
                    </div>
                    <div class="loading-menu-item">
                        <span class="menu-emoji">📋</span>
                        <span>Missões</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Navegação inferior -->
    <nav class="bottom-nav">
        <a href="pages/viloes.html" class="nav-item active" data-page="viloes" onclick="carregarPagina('viloes'); return false;">
            <span class="nav-icon">👾</span>
            <span class="nav-text">Vilões</span>
        </a>
        <a href="pages/mapa.html" class="nav-item" data-page="mapa" onclick="carregarPagina('mapa'); return false;">
            <span class="nav-icon">🗺️</span>
            <span class="nav-text">Mapa</span>
        </a>
        <a href="pages/npcs.html" class="nav-item" data-page="npcs" onclick="carregarPagina('npcs'); return false;">
            <span class="nav-icon">👥</span>
            <span class="nav-text">NPCs</span>
        </a>
        <a href="pages/necessidades.html" class="nav-item" data-page="necessidades" onclick="carregarPagina('necessidades'); return false;">
            <span class="nav-icon">📋</span>
            <span class="nav-text">Missões</span>
        </a>
    </nav>

    <!-- Modal -->
    <div id="modal-container">
        <div id="modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Título</h2>
                    <button class="close-modal" onclick="fecharModal()">&times;</button>
                </div>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <!-- Elementos decorativos -->
    <div class="floating-mushroom">🍄</div>
    <div class="floating-smurf">🧢</div>

    <!-- Scripts -->
    <script src="script.js"></script>
    


</body>
</html>
